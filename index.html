<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL Fractal Explorer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <canvas id="fractal" aria-label="Interactive 2D fractal explorer"></canvas>
      <canvas id="deepFractal" aria-label="High precision fractal refinement"></canvas>
      <canvas id="minimap" aria-label="Fractal overview minimap"></canvas>

      <section class="hud" aria-label="Fractal controls">
        <div class="brand">
          <span class="mark"></span>
          <div>
            <h1>Fractal Explorer</h1>
            <p id="fractalName">Mandelbrot Set</p>
          </div>
        </div>

        <div class="readouts">
          <div>
            <span>Zoom</span>
            <strong id="zoomReadout">1×</strong>
          </div>
          <div>
            <span>FPS</span>
            <strong id="fpsReadout">60</strong>
          </div>
          <div>
            <span>Eff. Iter</span>
            <strong id="iterReadout">256</strong>
          </div>
          <div>
            <span>Mode</span>
            <strong id="modeReadout">GPU</strong>
          </div>
        </div>

        <div class="control-grid">
          <label>
            <span>Fractal</span>
            <select id="fractalSelect" aria-label="Choose fractal"></select>
          </label>
          <label>
            <span>Iterations</span>
            <input id="iterations" type="range" min="32" max="1024" step="8" value="256">
          </label>
          <label>
            <span>Color</span>
            <input id="colorCycle" type="range" min="0" max="4" step="0.01" value="0">
          </label>
          <label id="juliaRow" style="display:none">
            <span>Parameter</span>
            <input id="juliaAngle" type="range" min="0" max="6.2832" step="0.01" value="0">
          </label>
          <label id="fixedJuliaRow" style="display:none">
            <span>Julia C</span>
            <div class="julia-picker">
              <input id="juliaReal" type="number" min="-1.5" max="1.5" step="0.001" aria-label="Julia real component">
              <input id="juliaImag" type="number" min="-1.5" max="1.5" step="0.001" aria-label="Julia imaginary component">
              <button id="btnRandomJulia" type="button" title="Randomize Julia seed">Rnd</button>
            </div>
          </label>
        </div>

        <div class="buttons" role="group" aria-label="Mode controls">
          <button id="btnPrevFractal" type="button" title="Previous fractal (Shift+F)">&lt;</button>
          <button id="btnNextFractal" type="button" title="Next fractal (F)">&gt;</button>
          <button id="btnPalette" type="button" title="Change palette (P)">Palette</button>
          <button id="btnRefine"  type="button" title="Toggle CPU refinement">Refine</button>
          <button id="btnReset"   type="button" title="Reset view (R)">Reset</button>
          <button id="btnShare"   type="button" title="Copy link (C)">Share</button>
        </div>
      </section>

      <section class="tips" aria-label="Input hints">
        <span>Drag to pan</span>
        <span>Scroll to zoom</span>
        <span>Pinch to zoom</span>
        <span>F — next fractal</span>
        <span>P — palette</span>
        <span>R — reset</span>
        <span>C — share</span>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
